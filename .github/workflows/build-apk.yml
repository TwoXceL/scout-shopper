name: Build Android Packages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build Android Packages (Debug APK, Release APK, Release AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload In-Aisle Test APK (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: scout-shopper-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release Packages (APK & Google Play AAB Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: scout-shopper-release-packages
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
